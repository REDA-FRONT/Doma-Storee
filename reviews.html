<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040813">
  <title>آراء العملاء | DOMA STORE</title>
  <meta name="description" content="تقييمات وتجارب العملاء لدى DOMA STORE. التقييمات التجريبية موضحة بوضوح على أنها أمثلة.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <header class="page-heading">
      <h1 data-i18n="reviews_title">آراء العملاء</h1>
      <p data-i18n="reviews_subtitle">تجارب العملاء وتقييماتهم</p>
    </header>

    <section class="rating-summary" id="reviews-summary" aria-live="polite">
      <strong class="display" id="reviews-average">—</strong>
      <div>
        <div id="reviews-summary-stars" class="review-stars" aria-label="Rating"></div>
        <span class="muted small"><span id="reviews-count">0</span> <span data-i18n="review_count">عدد التقييمات</span></span>
      </div>
    </section>

    <div class="review-grid" id="reviews-grid" aria-live="polite"></div>

    <p class="small muted" id="reviews-sample-note" data-i18n="sample_review_note">
      التقييمات المعروضة بعلامة (تجريبي) أمثلة توضيحية وليست آراء عملاء حقيقية.
    </p>

    <section class="banner-sell" style="margin-block:28px 64px">
      <div>
        <h2 data-i18n="share_experience">هل تريد مشاركة تجربتك؟ راسلنا.</h2>
        <p class="mb-0" data-i18n="sample_review_note">التقييمات المعروضة بعلامة (تجريبي) أمثلة توضيحية وليست آراء عملاء حقيقية.</p>
      </div>
      <a class="btn btn-whatsapp" href="#" data-contact-whatsapp target="_blank" rel="noopener">
        <i data-lucide="message-circle" aria-hidden="true"></i>WhatsApp
      </a>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="data/accounts.js"></script>
  <script src="data/reviews.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/forms.js"></script>
</body>
</html>
